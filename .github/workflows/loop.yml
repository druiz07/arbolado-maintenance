# Loop autónomo de mantenimiento — Sem 1: dry-observation.
#
# Sem 1 alcance:
#   - Tests del runner (policy engine) y del Worker (Dependabot normalizer) corren en CI.
#   - Listado de signals en Cloudflare KV (vía wrangler) → artifact para inspección humana.
#   - NO hay executor: Aider llega en Sem 2, classifier en Sem 3, router en Sem 4.
#
# Una vez consolidado Sem 2, este workflow gana un job `act-on-signals` que:
#   - clasifica cada signal (Gemini Flash con top-2 margin ≥ 0.15),
#   - aplica el playbook correspondiente con Aider,
#   - abre PR en arbolado-app con label auto:dry-run,
#   - escribe session-report JSON commit en este repo.

name: maintenance-loop

on:
  schedule:
    # Cada hora, alineado con la cadencia de Sem 1 (validar contratos, no acción todavía).
    # Sube/baja en Sem 2-4 según volumen real de signals.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      seed_test_signal:
        description: 'Sembrar signal:sem3-smoke-task12 en KV antes del job (debug E2E).'
        type: boolean
        default: false
      seed_transitive_signal:
        description: 'TD-12: sembrar signal transitive (override path) en KV antes del job (smoke E2E).'
        type: boolean
        default: false

# Opt-in temprano al runtime Node 24 para JS-based actions.
# A partir de 2026-06-02 GitHub lo fuerza por defecto; lo activamos antes para validar
# y eliminar el warning "Node.js 20 actions are deprecated" en upload-artifact@v5.
# Cuando todas las actions usadas tengan release nativo Node 24, este env var es
# innecesario y se puede quitar (ver docs/incident-response.md §5 — entrada 2026-05-25).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  issues: write   # para abrir issues si signal contract drift

concurrency:
  group: maintenance-loop
  cancel-in-progress: false

jobs:
  test-runner:
    name: Tests del runner (policy engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm test

  test-worker:
    name: Tests del Worker (Dependabot normalizer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  observe-signals:
    name: Listar signals en Cloudflare KV
    runs-on: ubuntu-latest
    needs: [test-runner, test-worker]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verify Cloudflare token present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret missing — cannot list KV signals"
            echo "Add via: gh secret set CLOUDFLARE_API_TOKEN --repo druiz07/arbolado-maintenance"
            exit 1
          fi
      - name: Install wrangler
        run: npm install -g wrangler@latest
      - name: List signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: e4ccfa519c1e0fb94221ca6583220545
          KV_NAMESPACE_ID: 212fe2e1b8874298ad44a9a906375033
        run: |
          mkdir -p signals-snapshot
          wrangler kv key list \
            --namespace-id "$KV_NAMESPACE_ID" \
            --prefix "signal:" \
            > signals-snapshot/keys.json || echo "[]" > signals-snapshot/keys.json
          echo "Signals encontradas:"
          jq 'length' signals-snapshot/keys.json || true
          # Para cada key, fetch del valor — limitado a 50 para no agotar
          # cuota; si Sem 2-3 detectan que excede regularmente, ampliar.
          jq -r '.[].name' signals-snapshot/keys.json | head -50 | while read -r key; do
            safe="${key//[:\/]/_}"
            wrangler kv key get "$key" \
              --namespace-id "$KV_NAMESPACE_ID" \
              > "signals-snapshot/${safe}.json" 2>/dev/null || true
          done
      - name: Upload signals as artifact
        uses: actions/upload-artifact@v5
        with:
          name: signals-${{ github.run_id }}
          path: signals-snapshot/
          retention-days: 30

  # apply-playbooks: pipeline completo cron horario (Sem 3 cerrada).
  #   loader → policy → invoker → CI → report → PR auto:dry-run → mark seen
  # Activado en cron horario tras smoke E2E happy-path verde 2026-05-10
  # (run 25639705586, report 151ca10, classifier margin=1.0).
  # Spec: docs/superpowers/plans/2026-05-10-g5-sem3-classifier-cron.md
  apply-playbooks:
    name: Aplicar playbook (cron horario)
    runs-on: ubuntu-latest
    needs: [test-runner]
    permissions:
      contents: write
      pull-requests: write
    env:
      ARBOLADO_APP_REPO: druiz07/arbolado-app
      # AIDER_MODEL ya no se hardcodea — viene del step `Resolve model alias`
      # (TD-7 cerrado en Sem 4 Sesión A). Si ese step falla, Invoke Aider falla
      # también — diseño deliberado: sin resolver no hay model id real.
    steps:
      # ---------- 1. Infra ----------
      - name: Checkout runner repo
        id: checkout-runner
        uses: actions/checkout@v5

      - name: Checkout arbolado-app
        id: checkout-app
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ARBOLADO_APP_REPO }}
          token: ${{ secrets.GH_PAT_ARBOLADO_APP }}
          path: app
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: runner/package-lock.json

      - name: Install Aider 0.86.2
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install aider-chat==0.86.2
          aider --version

      - name: npm ci (runner)
        working-directory: runner
        run: npm ci

      - name: Prepare workspace dirs
        run: mkdir -p workspace/intermediate workspace/state

      # ---------- 1b. (Debug) Sembrar signal de prueba si se pidió ----------
      # Solo activable vía workflow_dispatch con inputs.seed_test_signal=true.
      # Útil para smoke E2E cuando KV no tiene signals frescos (Sesión C).
      # No corre en cron (inputs no existe). Diseño: token local del usuario
      # puede ser read-only; el secret del repo tiene KV write.
      - name: Seed test signal in KV (debug only)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_test_signal == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SIGNAL='{"source":"worker","dependency":"eslint","current_version":"^8.54.0","vulnerable_versions":"<8.56.0","patched_versions":">=8.56.0","severity":"high","is_transitive":false,"dependency_type":"dev","advisory_id":"GHSA-sem3-task12","detected_at":"2026-05-10T20:00:00Z","signal_version":1}'
          # Hash determinista de los 5 stable keys (dependency, current_version,
          # vulnerable_versions, patched_versions, advisory_id). Si cambia el
          # SIGNAL hardcoded de arriba en esos campos, actualizar también este
          # hash. Computado vía generateSignalHash de signal-hash.js.
          SIGNAL_HASH='e6c1e6509fc96432bc52307205f11c60b6db2cb08eb8b0aa451b39f916b1c9ed'
          # Borrar signal_seen:<hash> previo para que el smoke siempre re-procese
          # el seed signal (sin esto, runs sucesivos quedan no-op porque dedup
          # conserva el seen 30 d). DELETE de KV — tolera 404 (primera ejecución).
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/e4ccfa519c1e0fb94221ca6583220545/storage/kv/namespaces/212fe2e1b8874298ad44a9a906375033/values/signal_seen:$SIGNAL_HASH" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/seen-delete-response.json || true
          jq . /tmp/seen-delete-response.json || true
          echo "✓ cleared signal_seen:$SIGNAL_HASH (best-effort)"
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/e4ccfa519c1e0fb94221ca6583220545/storage/kv/namespaces/212fe2e1b8874298ad44a9a906375033/values/signal:sem3-smoke-task12" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-raw "$SIGNAL" \
            -o /tmp/seed-response.json
          jq . /tmp/seed-response.json
          echo "✓ seeded signal:sem3-smoke-task12 in KV"

      # ---------- 1b-bis. (Debug TD-12) Sembrar signal transitive ----------
      # Smoke E2E del flujo override: una transitiva benigna y ubicua (nanoid)
      # fijada a una versión publicada válida. Ejercita routing → apply-override
      # → npm install/audit/test/build → report → PR auto:dry-run. El advisory_id
      # es sintético: npm audit no lo reporta → auditClean=dependency_absent →
      # status=applied (valida el cableado, no la resolución de un CVE real).
      # Hash computado dinámicamente (robusto a cambios de campos, a diferencia
      # del hash hardcodeado del seed de arriba).
      - name: Seed transitive signal in KV (debug TD-12)
        if: github.event_name == 'workflow_dispatch' && inputs.seed_transitive_signal == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export SIGNAL='{"source":"worker","dependency":"nanoid","current_version":"3.3.6","vulnerable_versions":"<3.3.8","patched_versions":">=3.3.8","severity":"moderate","is_transitive":true,"dependency_type":"runtime","path":"electron-app/package-lock.json","advisory_id":"GHSA-td12-override-smoke","detected_at":"2026-05-15T15:00:00Z","signal_version":1}'
          SIGNAL_HASH=$(node --input-type=module -e "
            import { generateSignalHash } from './runner/session-report/signal-hash.js';
            process.stdout.write(generateSignalHash(JSON.parse(process.env.SIGNAL)));
          ")
          echo "computed signal_hash=$SIGNAL_HASH"
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/e4ccfa519c1e0fb94221ca6583220545/storage/kv/namespaces/212fe2e1b8874298ad44a9a906375033/values/signal_seen:$SIGNAL_HASH" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/seen-delete-td12.json || true
          echo "✓ cleared signal_seen:$SIGNAL_HASH (best-effort)"
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/e4ccfa519c1e0fb94221ca6583220545/storage/kv/namespaces/212fe2e1b8874298ad44a9a906375033/values/signal:td12-override-smoke" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-raw "$SIGNAL" \
            -o /tmp/seed-td12-response.json
          jq . /tmp/seed-td12-response.json
          echo "✓ seeded signal:td12-override-smoke in KV"

      # ---------- 2. Pipeline state machine ----------
      # Cada step escribe workspace/state/<step>.outcome con success|failure y
      # workspace/intermediate/<step>.json con su output. write-report compone
      # los argumentos finales leyendo esos archivos.

      - name: Load next unseen signal from Cloudflare KV
        id: load-signal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: e4ccfa519c1e0fb94221ca6583220545
          KV_NAMESPACE_ID: 212fe2e1b8874298ad44a9a906375033
        working-directory: runner
        run: |
          node scripts/cli/load-next-signal.mjs > ../workspace/intermediate/signal-load.json
          HAS=$(jq -r '.hasSignal' ../workspace/intermediate/signal-load.json)
          echo "has-signal=$HAS" >> $GITHUB_OUTPUT
          if [ "$HAS" = "false" ]; then
            echo "No unseen signals in KV — exiting job gracefully (downstream gated por has-signal=='true')"
            echo no-signal > ../workspace/state/load-signal.outcome
            exit 0
          fi
          jq '.signal' ../workspace/intermediate/signal-load.json > ../workspace/intermediate/signal.json
          jq -r '.signalHash' ../workspace/intermediate/signal-load.json > ../workspace/intermediate/signal-hash.txt
          jq -r '.kvKey' ../workspace/intermediate/signal-load.json > ../workspace/intermediate/signal-kv-key.txt
          echo success > ../workspace/state/load-signal.outcome
        continue-on-error: true

      # ---------- 1.b Route models (health-driven, Sem 4 router) ----------
      # Lee TODOS los session reports en docs/auto-maintenance/session-reports/,
      # computa métricas de salud (ventana 14d), y decide classifier model +
      # invoker promptVariant. Si insufficient_data (<6 reports cerrados),
      # devuelve defaults — no afecta producción. Cuando se acumule data,
      # activa automáticamente:
      #   - classifier escala a gemini-2.5-pro si classifier_failure_rate > 0.30
      #   - invoker promptVariant=conservative si policy_failure_rate > 0.50
      # NOTA: en v1 hardcodeamos bump-devdep-cve.yaml como playbook input al
      # router (sólo hay 1 playbook activo). Cuando entre el 2º playbook, este
      # step debe re-diseñarse para correr en 2 fases (classifier-routing antes
      # de classify; invoker-routing después de load-playbook).
      # router.invoker.model y router.invoker.promptVariant se consumen ambos
      # downstream: invoker_model → resolve-model (que lo resuelve a un id real
      # vía /v1/models antes de Invoke Aider); invoker_prompt_variant →
      # Invoke Aider directamente. Si el router falla silenciosamente
      # (continue-on-error true), resolve-model cae al primary del playbook.
      - name: Route models (Sem 4 router, health-driven)
        id: route-models
        if: steps.load-signal.outputs.has-signal == 'true'
        working-directory: runner
        run: |
          node scripts/cli/route-models.mjs \
            ../docs/auto-maintenance/playbooks/bump-devdep-cve.yaml \
            > ../workspace/intermediate/routing.json
          cat ../workspace/intermediate/routing.json | jq .
          CLASSIFIER_MODEL=$(jq -r '.classifier.model' ../workspace/intermediate/routing.json)
          INVOKER_MODEL=$(jq -r '.invoker.model' ../workspace/intermediate/routing.json)
          INVOKER_PROMPT_VARIANT=$(jq -r '.invoker.promptVariant' ../workspace/intermediate/routing.json)
          INSUFFICIENT=$(jq -r '.health.insufficient_data' ../workspace/intermediate/routing.json)
          echo "classifier_model=$CLASSIFIER_MODEL" >> $GITHUB_OUTPUT
          echo "invoker_model=$INVOKER_MODEL" >> $GITHUB_OUTPUT
          echo "invoker_prompt_variant=$INVOKER_PROMPT_VARIANT" >> $GITHUB_OUTPUT
          echo "insufficient_data=$INSUFFICIENT" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Classify signal → playbook (router-driven model, top-2 margin ≥ 0.15)
        id: classify
        if: steps.load-signal.outputs.has-signal == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: runner
        run: |
          MODEL='${{ steps.route-models.outputs.classifier_model }}'
          # Fallback defensivo si route-models falló silenciosamente.
          if [ -z "$MODEL" ] || [ "$MODEL" = "null" ]; then MODEL='gemini-2.5-flash'; fi
          echo "classifier model = $MODEL (insufficient_data=${{ steps.route-models.outputs.insufficient_data }})"
          node scripts/cli/classify-signal.mjs \
            --model "$MODEL" \
            ../workspace/intermediate/signal.json \
            ../docs/auto-maintenance/playbooks/ \
            > ../workspace/intermediate/classifier.json
          OK=$(jq -r '.ok' ../workspace/intermediate/classifier.json)
          if [ "$OK" = "true" ]; then
            PB_ID=$(jq -r '.playbookId' ../workspace/intermediate/classifier.json)
            echo "✓ classifier accepted playbook=$PB_ID margin=$(jq -r '.margin' ../workspace/intermediate/classifier.json)"
            echo success > ../workspace/state/classify.outcome
          else
            REASON=$(jq -r '.reason' ../workspace/intermediate/classifier.json)
            HINT=$(jq -r '.playbookHint' ../workspace/intermediate/classifier.json)
            echo "✗ classifier rejected reason=$REASON hint=$HINT"
            echo failure > ../workspace/state/classify.outcome
          fi
        continue-on-error: true

      - name: Load playbook (loader)
        id: load-playbook
        if: steps.classify.outcome == 'success'
        working-directory: runner
        run: |
          PB_ID=$(jq -r '.playbookId' ../workspace/intermediate/classifier.json)
          node scripts/cli/load-playbook.mjs \
            "../docs/auto-maintenance/playbooks/${PB_ID}.yaml" \
            > ../workspace/intermediate/playbook.json
          echo success > ../workspace/state/load-playbook.outcome
        continue-on-error: true

      # ---------- 2a.bis Detect playbook kind (TD-12 routing) ----------
      # Bifurca el pipeline según el playbook que resolvió el classifier:
      #   - bump-transitive-via-overrides → flujo determinista `apply-override`
      #     (runner/overrides, sin Aider/LLM). Cubre el 70 % de alertas reales
      #     que son transitivas (gap identificado en Sesión F, cerrado en P1/TD-11).
      #   - cualquier otro (hoy: bump-devdep-cve) → flujo Aider intacto.
      # El gate se aplica como cláusula extra en `resolve-model` (kind=='aider'):
      # toda la cadena Aider cascada de resolve-model.outcome, así que con
      # kind=='override' se salta entera sin tocar sus steps internos.
      - name: Detect playbook kind (TD-12)
        id: detect-playbook
        if: steps.load-playbook.outcome == 'success'
        working-directory: runner
        run: |
          PB_ID=$(jq -r '.meta.id' ../workspace/intermediate/playbook.json)
          echo "playbook_id=$PB_ID"
          if [ "$PB_ID" = "bump-transitive-via-overrides" ]; then
            echo "kind=override" >> $GITHUB_OUTPUT
          else
            echo "kind=aider" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      # ---------- 2b. Resolve model alias (Sem 4 Sesión A — TD-7) ----------
      # Lee el invoker.model que decidió el router (que hoy coincide con el
      # primary del playbook, pero puede divergir si el router escala). Lo
      # resuelve a un model id real disponible en Groq/Gemini consultando
      # GET /v1/models. Si el alias ya es real (e.g. `groq/llama-3.3-70b-versatile`),
      # passthrough con `mappedFrom=null`. Si no resuelve (provider down, 401,
      # modelo no disponible), Invoke Aider se salta (failure_stage=invoker).
      # Fallback defensivo: si route-models falló silenciosamente, leemos el
      # primary del playbook directamente.
      - name: Resolve model alias (TD-7)
        id: resolve-model
        # TD-12: sólo el flujo Aider. Si el playbook es bump-transitive-via-overrides
        # (kind=override) esta cadena entera se salta y actúa `apply-override`.
        if: steps.load-playbook.outcome == 'success' && steps.detect-playbook.outputs.kind == 'aider'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROUTER_INVOKER_MODEL: ${{ steps.route-models.outputs.invoker_model }}
        working-directory: runner
        run: |
          ALIAS="$ROUTER_INVOKER_MODEL"
          if [ -z "$ALIAS" ] || [ "$ALIAS" = "null" ]; then
            echo "router output empty — falling back to playbook primary"
            ALIAS=$(jq -r '.execution.model_strategy.primary' ../workspace/intermediate/playbook.json)
          fi
          node scripts/cli/resolve-alias.mjs "$ALIAS" > ../workspace/intermediate/resolved-model.json
          cat ../workspace/intermediate/resolved-model.json | jq .
          RESOLVED=$(jq -r '.resolved' ../workspace/intermediate/resolved-model.json)
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "null" ]; then
            echo "✗ alias resolution failed (resolved=null)"
            echo failure > ../workspace/state/resolve-model.outcome
            exit 1
          fi
          echo "alias=$ALIAS → resolved=$RESOLVED"
          echo "resolved=$RESOLVED" >> $GITHUB_OUTPUT
          echo success > ../workspace/state/resolve-model.outcome
        continue-on-error: true

      # ---------- 3. Pre-Aider: snapshot del package.json ----------
      # NOTA: arbolado-app no tiene package.json en root — vive en electron-app/.
      # Smoke real 2026-05-10 reveló esta asunción rota. Si en el futuro otro
      # playbook toca otro subdir del repo target, parametrizar esto desde
      # constraints.allowed_paths del playbook (ahora hardcoded al subdir único
      # que existe).
      - name: Snapshot package.json antes de Aider
        id: snapshot-before
        if: steps.resolve-model.outcome == 'success'
        run: |
          cp app/electron-app/package.json workspace/intermediate/package.before.json
          echo success > workspace/state/snapshot-before.outcome
        continue-on-error: true

      # ---------- 3.b Pre-Aider: dep_exists precondition (TD-1 mitigation) ----------
      # Mitiga el patrón TD-1 (Aider añade dep nueva en vez de bumpearla cuando
      # la dep no está aún en package.json). Si la dep del signal no existe en
      # la sección esperada, el CLI escribe un policy.json sintético con
      # violation `precondition_dep_missing` y exit 1 → invoke-aider se salta
      # y el report final registra failure_stage=policy con la violation real.
      - name: Check dep precondition (TD-1)
        id: dep-precondition
        if: steps.snapshot-before.outcome == 'success'
        working-directory: runner
        run: |
          set +e
          node scripts/cli/check-dep-exists.mjs \
            ../workspace/intermediate/signal.json \
            ../workspace/intermediate/package.before.json \
            ../workspace/intermediate/policy.json \
            > ../workspace/intermediate/precondition.json
          OK=$(jq -r '.ok' ../workspace/intermediate/precondition.json)
          if [ "$OK" = "true" ]; then
            echo "✓ precondition pass — dep está en la sección esperada"
            echo success > ../workspace/state/dep-precondition.outcome
            exit 0
          else
            echo "✗ precondition failed — invoke-aider se salta, report registra failure_stage=policy"
            cat ../workspace/intermediate/precondition.json
            echo failure > ../workspace/state/dep-precondition.outcome
            exit 1
          fi
        continue-on-error: true

      # ---------- 4. Invocar Aider ----------
      # AIDER_PROMPT_VARIANT viene del step Route models (Sem 4 router). Default
      # canonical. Si data muestra policy_failure_rate > 0.50, el router fuerza
      # 'conservative' (añade un párrafo final reforzando "si dudas, no toques").
      # AIDER_MODEL viene del step Resolve model alias (Sem 4 Sesión A — TD-7):
      # el playbook declara `groq/kimi-k2` (alias informal) y el resolver lo
      # mapea a un model id real disponible en la cuenta. router.invoker.model
      # sigue ignorado de momento — commit posterior puede cambiar resolve-model
      # para leer del router en vez del playbook.
      - name: Invoke Aider
        id: invoke-aider
        if: steps.snapshot-before.outcome == 'success' && steps.dep-precondition.outcome == 'success'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIDER_MODEL: ${{ steps.resolve-model.outputs.resolved }}
          AIDER_PROMPT_VARIANT: ${{ steps.route-models.outputs.invoker_prompt_variant || 'canonical' }}
        working-directory: runner
        run: |
          node --input-type=module -e "
            import { readFile, writeFile } from 'node:fs/promises';
            import { invokeAider } from './aider-invoker/index.js';
            const pb = JSON.parse(await readFile('../workspace/intermediate/playbook.json','utf8'));
            const signal = JSON.parse(await readFile('../workspace/intermediate/signal.json','utf8'));
            const section = signal.dependency_type === 'dev' ? 'devDependencies' : 'dependencies';
            const promptVariant = process.env.AIDER_PROMPT_VARIANT || 'canonical';
            const baseLines = [
              \`Objetivo: bumpear la dependencia '\${signal.dependency}' en \${section} de package.json a la versión segura \${signal.patched_versions}.\`,
              '',
              'REGLAS ESTRICTAS (cumplir todas):',
              \`- Si '\${signal.dependency}' NO existe en \${section}, NO la añadas. Termina sin modificar ningún fichero.\`,
              '- NO toques scripts, engines, name, version, ni otras secciones del package.json.',
              '- NO añadas ni quites otras dependencias.',
              \`- Preserva el rango semver actual (caret/tilde/fijo) usando la nueva versión \${signal.patched_versions}.\`,
              '- NO hagas major bump aunque la nueva versión lo permita.',
              '',
              'Devuelve SOLO el diff de package.json.',
            ];
            const conservativeTail = [
              '',
              'MODO CONSERVATIVE (router-activated por policy_failure_rate>0.50):',
              '- Si AMBIGÜEDAD en cualquier regla anterior → NO modifiques nada y termina con éxito.',
              \`- Verifica DOS veces que '\${signal.dependency}' aparece textualmente en \${section} antes de tocarla.\`,
              '- NO uses heurísticas de naming similar (ej. no asumas que \"react-dom\" cubre \"react\").',
            ];
            const prompt = (promptVariant === 'conservative' ? [...baseLines, ...conservativeTail] : baseLines).join('\n');
            console.error('aider prompt variant = ' + promptVariant);
            const r = await invokeAider({
              playbook: pb,
              signal,
              workdir: '../app/electron-app',
              files: ['package.json'],
              model: process.env.AIDER_MODEL,
              apiKey: process.env.GROQ_API_KEY,
              prompt,
              timeoutMs: 180000,
            });
            await writeFile('../workspace/intermediate/invoker.json', JSON.stringify(r));
            console.error('errorClass=' + r.errorClass);
          "
          echo success > ../workspace/state/invoke-aider.outcome
        continue-on-error: true

      - name: Snapshot package.json después de Aider
        id: snapshot-after
        if: steps.invoke-aider.outcome == 'success'
        run: |
          cp app/electron-app/package.json workspace/intermediate/package.after.json
          echo success > workspace/state/snapshot-after.outcome
        continue-on-error: true

      # ---------- 5. Policy validation (post-Aider) ----------
      - name: Policy validate (AST de package.json)
        id: policy-validate
        if: steps.snapshot-after.outcome == 'success'
        working-directory: runner
        run: |
          node scripts/cli/policy-validate.mjs \
            ../workspace/intermediate/playbook.json \
            ../workspace/intermediate/package.before.json \
            ../workspace/intermediate/package.after.json \
            > ../workspace/intermediate/policy.json
          VALID=$(jq -r '.valid' ../workspace/intermediate/policy.json)
          if [ "$VALID" = "true" ]; then
            echo success > ../workspace/state/policy-validate.outcome
          else
            echo failure > ../workspace/state/policy-validate.outcome
          fi
        continue-on-error: true

      # ---------- 6. enforceMaxDiff (post-Aider) ----------
      - name: enforceMaxDiff
        id: enforce-max-diff
        if: steps.snapshot-after.outcome == 'success'
        working-directory: app/electron-app
        run: |
          git diff --stat HEAD -- package.json package-lock.json \
            > ../../workspace/intermediate/git-diff-stat.txt
          cd ../../runner
          node scripts/cli/enforce-max-diff.mjs \
            ../workspace/intermediate/playbook.json \
            ../workspace/intermediate/git-diff-stat.txt \
            > ../workspace/intermediate/max-diff.json
          VALID=$(jq -r '.valid' ../workspace/intermediate/max-diff.json)
          if [ "$VALID" = "true" ]; then
            echo success > ../workspace/state/enforce-max-diff.outcome
          else
            echo failure > ../workspace/state/enforce-max-diff.outcome
          fi
        continue-on-error: true

      # ---------- 7. CI del repo arbolado-app ----------
      - name: CI tests (arbolado-app)
        id: ci-tests
        if: steps.policy-validate.outcome == 'success' && steps.enforce-max-diff.outcome == 'success'
        working-directory: app/electron-app
        run: |
          npm ci
          npm test
          echo success > ../../workspace/state/ci-tests.outcome
        continue-on-error: true

      - name: CI build (arbolado-app)
        id: ci-build
        if: steps.ci-tests.outcome == 'success'
        working-directory: app/electron-app
        run: |
          npm run build
          echo success > ../../workspace/state/ci-build.outcome
        continue-on-error: true

      # ---------- 7-bis. Flujo override determinista (TD-12) ----------
      # Sólo si el classifier resolvió bump-transitive-via-overrides. Determinista,
      # sin Aider/LLM/tokens. El wrapper apply-override.mjs inyecta IO real
      # (fs + child_process npm) al orquestador runner/overrides y traduce el
      # resultado a invoker.json/policy.json + outcomes ci-tests/ci-build
      # (overrides/report-bridge.js) para que el write-report compartido componga
      # el failure_stage SIN modificar el builder de session-report.
      # Rollback de package.json/lockfile lo hace el propio orquestador si
      # npm install/audit/test/build fallan; el repo target nunca queda sucio.
      - name: Apply override (TD-12, bump-transitive-via-overrides)
        id: apply-override
        if: steps.load-playbook.outcome == 'success' && steps.detect-playbook.outputs.kind == 'override'
        working-directory: runner
        run: |
          node scripts/cli/apply-override.mjs \
            ../workspace/intermediate/signal.json \
            ../app \
            .. \
            > ../workspace/intermediate/apply-override.json
          cat ../workspace/intermediate/apply-override.json | jq .
          STATUS=$(jq -r '.status' ../workspace/intermediate/apply-override.json)
          if [ "$STATUS" = "applied" ] || [ "$STATUS" = "noop" ]; then
            echo success > ../workspace/state/apply-override.outcome
          else
            echo failure > ../workspace/state/apply-override.outcome
          fi
        continue-on-error: true

      # Issue en arbolado-app si el override no fue efectivo por rango estricto
      # del paquete padre (edge_case parent_strict_range del playbook). El
      # orquestador ya restauró package.json/lockfile vía rollback.
      # NOTA: NO gatear por steps.apply-override.outcome — ese step es
      # continue-on-error y sale 0 aun con status=rolled_back, así que su
      # outcome es siempre 'success'. El gate correcto es la PRESENCIA del
      # fichero: el wrapper apply-override.mjs escribe override-issue.json
      # SOLO en rolled_back:npm_install (edge_case parent_strict_range).
      - name: Open parent_strict_range issue (TD-12)
        if: always() && hashFiles('workspace/intermediate/override-issue.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ARBOLADO_APP }}
        run: |
          TITLE=$(jq -r '.title' workspace/intermediate/override-issue.json)
          BODY=$(jq -r '.body' workspace/intermediate/override-issue.json)
          gh issue create \
            --repo "$ARBOLADO_APP_REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label auto:maintenance || echo 'issue create failed — manual review needed'
        continue-on-error: true

      # ---------- 8. Componer y escribir el session report ----------
      # Este step SIEMPRE corre, incluso si los anteriores fallaron.
      # El report registra el failure_stage según los outcomes acumulados.
      - name: Build and write session report
        id: write-report
        if: always() && steps.load-signal.outputs.has-signal == 'true'
        working-directory: runner
        run: |
          node scripts/cli/build-and-write-report.mjs .. \
            > ../workspace/intermediate/report-result.json
          cat ../workspace/intermediate/report-result.json
          echo success > ../workspace/state/write-report.outcome

      - name: Commit and push session report
        id: commit-report
        if: always() && steps.write-report.outcome == 'success'
        run: |
          REPORT_PATH=$(jq -r '.path' workspace/intermediate/report-result.json)
          STAGE=$(jq -r '.failure_stage' workspace/intermediate/report-result.json)
          git config user.name 'arbolado-maintenance-bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          PB=$(jq -r '.playbookId // "unknown"' workspace/intermediate/classifier.json 2>/dev/null || echo unknown)
          git add docs/auto-maintenance/session-reports/
          git commit -m "report(g5): $PB $(jq -r '.dependency' workspace/intermediate/signal.json) ($STAGE)" \
            || echo 'nothing to commit (idempotency hit)'
          git push origin HEAD:main || echo 'push failed — manual review needed'

      # ---------- 9. Abrir PR auto:dry-run en arbolado-app (sólo si failure_stage=none) ----------
      - name: Open auto:dry-run PR in arbolado-app
        id: open-pr
        # TD-12: este PR es del flujo Aider. El override tiene su propio step
        # (Open auto:dry-run PR (override)) — sin el gate kind=='aider' este
        # step dispararía también para overrides y abriría un PR con rama y
        # cuerpo de bump-devdep-cve sobre cambios de override (PR duplicado).
        if: always() && steps.write-report.outcome == 'success' && steps.detect-playbook.outputs.kind == 'aider'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ARBOLADO_APP }}
        working-directory: app
        run: |
          STAGE=$(jq -r '.failure_stage' ../workspace/intermediate/report-result.json)
          if [ "$STAGE" != "none" ]; then
            echo "skip PR — failure_stage=$STAGE"
            exit 0
          fi

          SIGNAL_HASH=$(node --input-type=module -e "
            import { shortSignalHash } from '../runner/session-report/index.js';
            import { readFile } from 'node:fs/promises';
            const s = JSON.parse(await readFile('../workspace/intermediate/signal.json','utf8'));
            process.stdout.write(shortSignalHash(s));
          ")
          BRANCH="auto/bump-devdep-cve-${SIGNAL_HASH}"

          git config user.name 'arbolado-maintenance-bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add package.json package-lock.json || true
          # --allow-empty: Aider may produce a no-op when the dep is already at the patched version;
          # the PR is still useful as an audit trail (body links the run_id and signal hash).
          git commit --allow-empty -m "[AUTO-DRY-RUN][playbook:bump-devdep-cve] $(jq -r '.dependency' ../workspace/intermediate/signal.json) $(jq -r '.patched_versions' ../workspace/intermediate/signal.json)"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$ARBOLADO_APP_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "[auto:dry-run] bump $(jq -r '.dependency' ../workspace/intermediate/signal.json)" \
            --body "Generated by maintenance-loop run \`${{ github.run_id }}\`. Signal: \`${SIGNAL_HASH}...\`. Playbook: bump-devdep-cve. Failure stage: ${STAGE}." \
            --label auto:dry-run

      # ---------- 9-bis. PR auto:dry-run del flujo override (TD-12) ----------
      # Análogo al PR de Aider pero para bump-transitive-via-overrides: la rama
      # y el commit reflejan el playbook override y los ficheros viven en
      # electron-app/ (package.json con la entrada overrides + package-lock.json
      # regenerado por npm install). Label auto:dry-run SIEMPRE (contrato robot:
      # runtime deps nunca auto-publicadas; Daniel revisa y mergea).
      - name: Open auto:dry-run PR (override) in arbolado-app
        id: open-pr-override
        if: always() && steps.write-report.outcome == 'success' && steps.detect-playbook.outputs.kind == 'override'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ARBOLADO_APP }}
        working-directory: app
        run: |
          STAGE=$(jq -r '.failure_stage' ../workspace/intermediate/report-result.json)
          if [ "$STAGE" != "none" ]; then
            echo "skip PR — failure_stage=$STAGE (override no aplicado/rolled_back)"
            exit 0
          fi

          SIGNAL_HASH=$(node --input-type=module -e "
            import { shortSignalHash } from '../runner/session-report/index.js';
            import { readFile } from 'node:fs/promises';
            const s = JSON.parse(await readFile('../workspace/intermediate/signal.json','utf8'));
            process.stdout.write(shortSignalHash(s));
          ")
          DEP=$(jq -r '.dependency' ../workspace/intermediate/signal.json)
          PATCHED=$(jq -r '.patched_versions' ../workspace/intermediate/signal.json)
          BRANCH="auto/override-${DEP}-${SIGNAL_HASH}"

          git config user.name 'arbolado-maintenance-bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          git checkout -B "$BRANCH"
          # El override toca electron-app/package.json (entrada overrides) y
          # regenera electron-app/package-lock.json vía npm install.
          git add electron-app/package.json electron-app/package-lock.json || true
          # --allow-empty: status=noop (ya fijado) no produce diff pero el PR
          # sigue siendo útil como audit trail (run_id + signal hash).
          git commit --allow-empty -m "[AUTO-DRY-RUN][playbook:bump-transitive-via-overrides] ${DEP} ${PATCHED}"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$ARBOLADO_APP_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "[auto:dry-run] override transitive ${DEP}" \
            --body "Generated by maintenance-loop run \`${{ github.run_id }}\`. Signal: \`${SIGNAL_HASH}...\`. Playbook: bump-transitive-via-overrides (determinista, sin Aider). Transitiva fijada vía package.json#overrides; lockfile regenerado; npm audit post-fix limpio. Failure stage: ${STAGE}." \
            --label auto:dry-run

      # ---------- 9b. Marcar signal como visto en KV (best-effort) ----------
      # Solo se marca si el report se escribió. Si falla (red/cuota), no bloquea.
      # TTL 30 días — un signal regresado se reprocesa en un mes (suficiente).
      - name: Mark signal as seen in KV
        if: always() && steps.write-report.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: e4ccfa519c1e0fb94221ca6583220545
          KV_NAMESPACE_ID: 212fe2e1b8874298ad44a9a906375033
        working-directory: runner
        run: |
          if [ ! -f ../workspace/intermediate/signal-hash.txt ]; then
            echo "no signal-hash.txt — skipping (no signal was loaded)"
            exit 0
          fi
          HASH=$(cat ../workspace/intermediate/signal-hash.txt)
          node scripts/cli/mark-signal-seen.mjs "$HASH"

      # ---------- 10. Upload artifacts (debug) ----------
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apply-playbooks-${{ github.run_id }}
          path: workspace/
          retention-days: 14
