name: pr-merged-listener
# Escucha repository_dispatch desde arbolado-app cuando un PR auto:dry-run
# se cierra. Actualiza el session report correspondiente con pr_merged.
#
# Payload esperado (client_payload):
#   - short_hash: string (hex12) — primeros 12 chars del signal_hash, presente en el filename
#   - merged: boolean
#   - pr_number: number (informativo, para logs)
#   - pr_url: string (informativo)
#
# El listener resuelve short_hash → ruta del report localmente (sin depender
# del search API de GitHub, que tiene latencia de indexación en repos pequeños).

on:
  repository_dispatch:
    types: [pr-merged]

jobs:
  update-report:
    name: Update session report pr_merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout (full history para commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate payload
        id: payload
        run: |
          SHORT='${{ github.event.client_payload.short_hash }}'
          MERGED='${{ github.event.client_payload.merged }}'
          if [ -z "$SHORT" ] || [ -z "$MERGED" ]; then
            echo "::error::Missing client_payload.short_hash or merged"
            exit 1
          fi
          if [ "$MERGED" != "true" ] && [ "$MERGED" != "false" ]; then
            echo "::error::merged must be true or false, got: $MERGED"
            exit 1
          fi
          if ! echo "$SHORT" | grep -qE '^[a-f0-9]{12}$'; then
            echo "::error::short_hash must be 12 hex chars, got: $SHORT"
            exit 1
          fi
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "merged=$MERGED" >> $GITHUB_OUTPUT
          echo "PR #${{ github.event.client_payload.pr_number }} (${{ github.event.client_payload.pr_url }}): short_hash=$SHORT merged=$MERGED"

      - name: Resolve full signal_hash from local report
        id: resolve
        run: |
          SHORT='${{ steps.payload.outputs.short }}'
          FILE=$(find docs/auto-maintenance/session-reports -type f -name "*-${SHORT}.json" | head -1)
          if [ -z "$FILE" ]; then
            echo "::warning::No session report file matches short_hash=$SHORT — skipping (race or pre-G.5 PR)"
            echo "found=" >> $GITHUB_OUTPUT
            exit 0
          fi
          FULL_HASH=$(jq -r '.signal_hash' "$FILE")
          echo "Resolved $SHORT → $FULL_HASH (file: $FILE)"
          echo "hash=$FULL_HASH" >> $GITHUB_OUTPUT
          echo "found=1" >> $GITHUB_OUTPUT

      - name: Update session report
        if: steps.resolve.outputs.found == '1'
        working-directory: runner
        run: |
          node scripts/cli/update-session-report-on-merge.mjs \
            '${{ steps.resolve.outputs.hash }}' \
            '${{ steps.payload.outputs.merged }}'

      - name: Commit and push
        if: steps.resolve.outputs.found == '1'
        run: |
          git config user.name 'arbolado-maintenance-bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          git add docs/auto-maintenance/session-reports/
          if git diff --cached --quiet; then
            echo "no changes to commit (report already at this value)"
            exit 0
          fi
          git commit -m "update(g5): session report pr_merged=${{ steps.payload.outputs.merged }} for ${{ steps.resolve.outputs.hash }}"
          git push origin HEAD:main
