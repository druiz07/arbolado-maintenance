name = "arbolado-maintenance-detector"
main = "src/worker.ts"
compatibility_date = "2026-05-09"
account_id = "e4ccfa519c1e0fb94221ca6583220545"

[[kv_namespaces]]
binding = "STATE"
id = "212fe2e1b8874298ad44a9a906375033"

# El cron de cada 30 min consume ~1 440 invocaciones/mes — sobra holgadamente
# en el free tier (100k req/día). Se baja a */15 si la latencia de detección
# importa más que la cuota.
[triggers]
crons = ["*/30 * * * *"]

# Variables sin secreto (públicas)
[vars]
TARGET_REPO_OWNER = "druiz07"
TARGET_REPO_NAME = "arbolado-app"
SIGNAL_TTL_SECONDS = "86400"   # 24h — alineado con cooldown_minutes max de los playbooks

# GH_PAT_ARBOLADO_APP se inyecta como secret:
#   wrangler secret put GH_PAT_ARBOLADO_APP
# Mismo PAT que en arbolado-maintenance GH Actions secret (un solo secreto, dos sitios).
