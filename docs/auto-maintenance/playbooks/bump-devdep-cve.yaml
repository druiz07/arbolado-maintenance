# MIRROR del canónico — autoritativo en
# https://github.com/druiz07/arbolado-app/blob/main/docs/auto-maintenance/playbooks/bump-devdep-cve.yaml
#
# Esta copia existe para que el loader del runner pueda cargar todos los playbooks
# desde un único directorio sin checkout cruzado del repo privado.
#
# DRIFT 2026-05-12 (Sem 4 Sesión C): el bloque `aider.prompt` de abajo se refina
# para que el spec refleje las nuevas reglas TD-1 (precondición dep_exists +
# disclaimer explícito "NO añadas dep si no existe"). El runtime cargado por el
# loader es esta copia, así que es la load-bearing. La canónica en arbolado-app
# queda desincronizada hasta TD-10 (resync canónica vía PR cross-repo).
#
# Históricas:
# - 2026-05-09 (Sem 1): primera copia tras Sesión 0 — hash idéntico al canónico.
# - 2026-05-12 (Sem 4 Sesión C): drift voluntario — ver TD-10.

id: bump-devdep-cve
version: 1
description: >
  Aplica parche automático a CVEs detectados en devDependencies cuando existe
  versión segura compatible sin romper semver rules.

trigger:
  type: dependabot_alert | sentry | custom_worker
  signal_schema:
    type: object
    required:
      - source
      - dependency
      - severity
      - current_version
      - dependency_type
    properties:
      source:
        type: string
        enum: [dependabot, snyk, worker]
      dependency:
        type: string
      current_version:
        type: string
      vulnerable_versions:
        type: string
      patched_versions:
        type: string
      severity:
        type: string
        enum: [low, moderate, high, critical]
      is_transitive:
        type: boolean
      dependency_type:
        type: string
        enum: [dev, runtime]
      path:
        type: string
      advisory_id:
        type: string
      context:
        type: object
        properties:
          parent_dependency:
            type: string
            nullable: true
          fix_available:
            type: boolean

classifier:
  model: gemini-2.5-flash
  temperature: 0.1
  top_p: 0.9
  margin_threshold: 0.15
  prompt: |
    Eres un clasificador de señales para mantenimiento automático.
    Tu tarea es mapear una señal a un playbook.
    Responde SOLO en JSON:
    {
      "playbook_id": "...",
      "confidence": 0.0-1.0
    }
    Reglas:
    - Usa "bump-devdep-cve" SOLO si:
      - dependency_type == "dev"
      - Existe patched_versions
    - Si dependency_type == "runtime" → NO seleccionar este playbook
    - Si no hay parche disponible → confidence bajo

constraints:
  allowed_paths:
    - package.json
    - package-lock.json
  forbidden_paths:
    - electron-app/src/main/**
    - electron-app/src/preload/**
  allowed_operations:
    - bump_version
  forbidden_operations:
    - remove_dependency
    - change_scripts
    - modify_engines
  require_dev_dependency: true
  version_rules:
    allowed_range_changes:
      - patch
      - minor
    forbid_major_bumps: true
    forbid_range_widening: true
  max_diff_lines: 200
  required_checks:
    - npm test
    - npm run build
  retry_limit: 3
  cooldown_minutes: 30
  classify_confidence_min: 0.85
  critical: false

execution:
  model_strategy:
    # TODO Sem 4 (router LLM): `groq/kimi-k2` es alias informal. El smoke real
    # del 2026-05-10 confirmó que en Groq Cloud free tier no existe ningún
    # modelo Kimi K2 disponible para la cuenta del usuario (ni alias antiguo
    # ni `kimi-k2-instruct-0905`). El router debe consultar
    # https://api.groq.com/openai/v1/models al inicio y resolver alias →
    # modelo real disponible (p.ej. `groq/llama-3.3-70b-versatile` como
    # primary actual, validado con smoke real 2026-05-10 — coste $0.0015 / 6s).
    primary: groq/kimi-k2
    fallback: google/gemini-2.5-flash
    backup: openrouter/free
  pre_aider_steps:
    - resolveSafeVersion:
        input: { dep: signal.dependency, range: signal.patched_versions }
        on_null: edge_case.no_patch_available
    - dedupCheck:
        key: "signal_seen:{{signal_hash}}"
        on_hit: skip_duplicate_signal
    # TD-1 mitigation (Sem 4 Sesión C): valida que la dep ya existe en
    # devDependencies/dependencies antes de invocar Aider. Si no existe,
    # genera policy.json sintético con violation `precondition_dep_missing`
    # y se salta Aider. Implementado en runner/preconditions/dep-exists.js
    # + scripts/cli/check-dep-exists.mjs. Cableado en .github/workflows/loop.yml.
    - depExistsCheck:
        input: { dep: signal.dependency, dep_type: signal.dependency_type }
        on_missing: skip_aider_with_policy_violation
  aider:
    args:
      - --no-stream
      - --yes
      - --map-tokens 0
      - --edit-format diff
    temperature: 0.1
    prompt: |
      Objetivo: bumpear la dependencia '{{signal.dependency}}' en
      {{#if (eq signal.dependency_type "dev")}}devDependencies{{else}}dependencies{{/if}}
      de package.json a la versión segura {{safe_version_selected}}
      (NO inventar otra).

      REGLAS ESTRICTAS (cumplir todas):
      - Si '{{signal.dependency}}' NO existe ya en esa sección, NO la añadas.
        Termina sin modificar ningún fichero. (Esto NO debería ocurrir porque
        el step depExistsCheck ya filtra; queda como defensa en profundidad.)
      - SOLO modificar package.json y package-lock.json.
      - NO tocar scripts, engines, name, version ni otras secciones.
      - NO añadir ni quitar otras dependencias.
      - Preservar el rango semver actual (caret/tilde/fijo) usando la nueva versión.
      - NO hacer major bump aunque la nueva versión lo permita.
      {{#if signal.is_transitive}}
      Dependencia transitiva → actualizar parent: {{signal.context.parent_dependency}}
      NO toques la dep transitiva directamente.
      {{/if}}
      Señal: {{signal_json}}
      Devuelve SOLO el diff de package.json.
  post_aider_steps:
    - enforceMaxDiff:
        max: constraints.max_diff_lines
        on_exceed: block_diff_size_exceeded

postconditions:
  require_tests_pass: true
  require_build_pass: true
  on_failure:
    action: retry_or_issue

edge_cases:
  no_patch_available:
    action: open_issue
    reason: "no_safe_version"
  transitive_dependency:
    action: attempt_indirect_fix
    note: "bump parent dependency si aplica"
  requires_major_bump:
    action: open_issue
    reason: "major_bump_required"
  duplicate_signal:
    action: skip
    reason: "signal_hash_already_processed_within_24h"
