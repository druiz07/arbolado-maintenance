# Derivado del canónico bump-devdep-cve.yaml.
#
# Caso de uso: tras un bump menor en una dep transitiva (típicamente Dependabot
# auto-merged o npm install drift), los tests fallan por cambios sutiles de
# behaviour. NO actualizamos la dep — actualizamos los tests para que reflejen
# el nuevo behaviour, manteniendo el mismo contrato funcional.
#
# Diferencias clave vs. canónico:
# - allowed_paths: archivos de tests, NO package.json
# - allowed_operations: vacío (no tocamos deps)
# - forbidden_operations: incluye bump_version (este playbook NO bumpea)
# - require_dev_dependency: irrelevante (no toca pkg.json)
# - max_diff_lines: 150 (los fix de tests deberían ser puntuales)

id: fix-tests-minor-version-bump
version: 1
description: >
  Repara tests que fallan tras un bump menor en dep transitiva.
  Actualiza los tests, NO la dep — la dep es la fuente de verdad nueva.

trigger:
  type: ci_failure | github_actions_log
  signal_schema:
    type: object
    required:
      - source
      - failed_tests
      - last_dep_change
      - branch
    properties:
      source:
        type: string
        enum: [github_actions, jenkins]
      failed_tests:
        type: array
        items:
          type: object
          properties:
            file: { type: string }
            test: { type: string }
            error: { type: string }
      last_dep_change:
        type: object
        properties:
          dependency: { type: string }
          old_version: { type: string }
          new_version: { type: string }
          change_type: { type: string, enum: [patch, minor] }
      branch:
        type: string

classifier:
  model: gemini-2.5-flash
  temperature: 0.1
  top_p: 0.9
  margin_threshold: 0.15
  prompt: |
    Eres un clasificador de señales para mantenimiento automático.
    Mapea la señal a un playbook. Responde SOLO en JSON:
    {
      "playbook_id": "...",
      "confidence": 0.0-1.0
    }
    Reglas para "fix-tests-minor-version-bump":
    - failed_tests no vacío
    - last_dep_change.change_type ∈ {patch, minor}
    - SI hay error claramente NO relacionado con el bump → confidence bajo
    - SI failed_tests > 20 → confidence bajo (probablemente regresión gorda, no auto-fix)

constraints:
  allowed_paths:
    - electron-app/src/**/*.test.js
    - electron-app/src/**/*.test.jsx
    - electron-app/src/**/__tests__/**
    - cloudflare-worker/test/**
  forbidden_paths:
    - package.json
    - package-lock.json
    - electron-app/src/main/**
    - electron-app/src/preload/**
  allowed_operations: []
  forbidden_operations:
    - bump_version
    - add_dependency
    - remove_dependency
    - change_scripts
    - modify_engines
  max_diff_lines: 150
  required_checks:
    - npm test
    - npm run build
  retry_limit: 2
  cooldown_minutes: 60
  classify_confidence_min: 0.80
  critical: false

execution:
  model_strategy:
    # TODO Sem 4 (router LLM): `groq/kimi-k2` es alias informal. El smoke real
    # del 2026-05-10 confirmó que en Groq Cloud free tier no existe ningún
    # modelo Kimi K2 disponible para la cuenta del usuario. El router debe
    # consultar https://api.groq.com/openai/v1/models y resolver alias →
    # modelo real (p.ej. `groq/llama-3.3-70b-versatile`).
    primary: groq/kimi-k2
    fallback: google/gemini-2.5-flash
    backup: openrouter/free
  pre_aider_steps:
    - dedupCheck:
        key: "signal_seen:{{signal_hash}}"
        on_hit: skip_duplicate_signal
    # Slice de input: SOLO los archivos en signal.failed_tests[].file
    - sliceInput:
        files_from: signal.failed_tests[].file
        on_empty: edge_case.no_test_files
  aider:
    args:
      - --no-stream
      - --yes
      - --map-tokens 0
      - --edit-format diff
    temperature: 0.1
    prompt: |
      Objetivo: arreglar tests que fallan tras un bump menor.

      Cambio que disparó el fallo:
        {{signal.last_dep_change.dependency}}
        {{signal.last_dep_change.old_version}} → {{signal.last_dep_change.new_version}}
        ({{signal.last_dep_change.change_type}} bump)

      Reglas estrictas:
      - SOLO modificar archivos de tests pasados como input
      - NO tocar package.json, package-lock.json, scripts, ni código de producción
      - NO desactivar tests (xit, .skip) — arreglarlos
      - Si los tests son correctos y el bump introdujo bug real → NO hacer cambios
        (el sistema abrirá issue para revisión humana)
      - Mantén nombres de tests, sólo ajusta expectativas/assertions

      Tests fallidos:
      {{signal.failed_tests}}

      Devuelve SOLO el diff.
  post_aider_steps:
    - enforceMaxDiff:
        max: constraints.max_diff_lines
        on_exceed: block_diff_size_exceeded
    # Verifica que no se desactivaron tests por la vía sucia
    - rejectIfTestsSkipped:
        patterns: ["xit(", ".skip(", "test.skip(", "describe.skip("]
        on_match: block_tests_disabled

postconditions:
  require_tests_pass: true
  require_build_pass: true
  on_failure:
    action: retry_or_issue

edge_cases:
  no_test_files:
    action: open_issue
    reason: "signal_failed_tests_empty"
  bump_introduced_real_bug:
    action: open_issue
    reason: "test_changes_would_hide_real_regression"
  too_many_failures:
    action: open_issue
    reason: "more_than_20_failed_tests_skipped_auto_fix"
